# G.K. BTU Students — frontend, deployed as a Cloudflare Worker serving static assets
# Deploy: `npm run deploy` (vite build, then `wrangler deploy`)
name = "gk-btu-students"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
# Single-page app: unknown paths serve index.html so client-side routes work on reload
not_found_handling = "single-page-application"
