name: Deploy frontend to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # job-level so the deploy step can be skipped until the secret exists
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # The deployed API Worker URL (no trailing slash); the repository variable VITE_API_URL overrides it
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://aiagent-back.giorgi-khatiashvili-9e4.workers.dev' }}
      # Deploys the "aiagent-front" Worker (static assets, see wrangler.toml). Pull requests only build.
      - name: Deploy
        if: ${{ github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
